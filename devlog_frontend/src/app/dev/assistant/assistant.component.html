<div class="flex h-screen antialiased text-gray-800 dark:text-gray-200 dark:bg-gray-900">
  <div class="flex flex-col w-full max-w-6xl mx-auto overflow-hidden">
    <!-- Header with title and clear button -->
    <div class="flex items-center justify-between p-4 border-b dark:border-gray-700">
      <div class="flex items-center space-x-2">
        <svg class="w-6 h-6 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path>
        </svg>
        <h1 class="text-xl font-semibold">Flux AI</h1>
      </div>
      <button
        class="flex items-center px-3 py-2 text-sm font-medium text-red-500 bg-red-100 rounded-lg hover:bg-red-200 dark:bg-red-900/30 dark:hover:bg-red-800/40 transition-colors"
        (click)="clearChat()"
      >
        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
        </svg>
        Clear Chat
      </button>
    </div>

    <!-- Chat Messages Area -->
    <div class="flex-1 p-4 overflow-y-auto">
      <div class="flex flex-col space-y-4">
        <!-- Messages Container -->
        <div *ngFor="let message of messages; let i = index" 
             class="flex w-full" 
             [ngClass]="message.sender === 'user' ? 'justify-end' : 'justify-start'">
          <div class="flex max-w-xs md:max-w-md lg:max-w-lg"
               [ngClass]="message.sender === 'user' ? 'flex-row-reverse' : 'flex-row'">
            <!-- Avatar -->
            <div class="flex-shrink-0" [ngClass]="message.sender === 'user' ? 'ml-3' : 'mr-3'">
              <div class="flex items-center justify-center w-10 h-10 rounded-full text-white"
                   [ngClass]="message.sender === 'user' ? 'bg-indigo-600' : 'bg-emerald-600'">
                {{ message.sender === 'user' ? userName.charAt(0).toUpperCase() : 'A' }}
              </div>
            </div>
            
            <!-- Message Bubble with Improved Timestamp -->
            <div class="relative px-4 py-3 text-sm rounded-xl shadow-sm min-w-[80px]"
                 [ngClass]="message.sender === 'user' ? 
                           'bg-indigo-100 dark:bg-indigo-700/70 text-indigo-900 dark:text-indigo-50' : 
                           'bg-gray-100 dark:bg-gray-700 text-gray-800 dark:text-gray-100'">
              <div [innerHTML]="message.text"></div>
              <div class="text-xs text-gray-500 dark:text-gray-400 mt-2 text-right">
                {{ message.timestamp | date:'shortTime' }}
              </div>
            </div>
          </div>
        </div>
        
        <!-- Loading Indicator -->
        <div *ngIf="isLoading" class="flex justify-start">
          <div class="flex items-center space-x-2 px-4 py-2 bg-gray-100 dark:bg-gray-700 rounded-xl shadow-sm">
            <div class="flex space-x-1">
              <div class="w-2 h-2 rounded-full bg-gray-400 dark:bg-gray-300 animate-bounce" style="animation-delay: 0ms"></div>
              <div class="w-2 h-2 rounded-full bg-gray-400 dark:bg-gray-300 animate-bounce" style="animation-delay: 300ms"></div>
              <div class="w-2 h-2 rounded-full bg-gray-400 dark:bg-gray-300 animate-bounce" style="animation-delay: 600ms"></div>
            </div>
            <span class="text-sm text-gray-500 dark:text-gray-400">Thinking...</span>
          </div>
        </div>
      </div>
    </div>
    
    <!-- Input Area -->
    <div class="p-4 border-t dark:border-gray-700">
      <div class="flex items-center bg-white dark:bg-gray-800 rounded-lg shadow overflow-hidden">
        <div class="flex-1">
          <input
            [(ngModel)]="userPrompt"
            type="text"
            class="w-full px-4 py-3 bg-transparent border-0 focus:ring-0 focus:outline-none dark:text-white"
            placeholder="Type your message..."
            (keyup.enter)="sendMessage()"
          />
        </div>
        <div class="px-3">
          <button
            class="flex items-center justify-center p-2 rounded-full bg-indigo-600 hover:bg-indigo-700 text-white transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
            [disabled]="!userPrompt.trim().length"
            (click)="sendMessage()"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
            </svg>
          </button>
        </div>
      </div>
      <div class="mt-2 text-xs text-center text-gray-500 dark:text-gray-400">
        Messages are not stored permanently and will be cleared when you leave
      </div>
    </div>
  </div>
</div>
